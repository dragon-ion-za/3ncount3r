services:
  mongo:
    image: mongo:latest
    restart: always
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - 3ncount3rDataRepl:/data/db
      - ./scripts/rs-initiate.js:/docker-entrypoint-initdb.d/rs-initiate.js
    expose:
      - 27017
    ports:
      - '27017:27017'
  cl3anslat3-api:
    build:
      context: .
      dockerfile: cl3anslat3-api.dockerfile
    restart: always
    volumes:
      - ./data:/data
    ports:
      - '6001:5001'
  3ncount3r-api:
    build:
      context: .
      dockerfile: 3ncount3r-api.dockerfile
    restart: always
    ports:
      - '6002:8080'
  charact3r-api:
    build:
      context: .
      dockerfile: charact3r-api.dockerfile
    restart: always
    ports:
      - '6003:8080'
  orch3strator-api:
    build:
      context: .
      dockerfile: orch3strator-api.dockerfile
    restart: always
    ports:
      - '6004:8080'
  3ncount3r-spa:
    build:
      context: .
      dockerfile: 3ncount3r-spa.dockerfile
    restart: always
    ports:
      - '13133:80'
  shell:
    build:
      context: .
      dockerfile: 3ncount3r-shell.dockerfile
    restart: always
    ports:
      - '13134:80'
volumes:
  3ncount3rDataRepl:
